# A version tag (v0.1.0) publishes the Docker images to GitHub Container Registry and a GitHub
# release whose assets are all an install needs: docker-compose.yml, env.example, the backup
# and restore scripts and the monitoring add-on. Images are multi-arch (amd64 and arm64),
# scanned for known vulnerabilities before they are pushed, and come with signed build
# provenance: `gh attestation verify oci://ghcr.io/vogster/chinchi-server:<version> --owner vogster`.
#
#   1. Set the version in deploy/docker-compose.yml (the CHINCHI_VERSION default) and commit.
#   2. git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write
  # Build provenance attestations (Sigstore, keyless).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "registry=$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          # The compose file users download must run exactly this release.
          for image in chinchi-server chinchi-web; do
            grep -q "${image}:\${CHINCHI_VERSION:-${version}}" deploy/docker-compose.yml || {
              echo "deploy/docker-compose.yml does not default $image to $version" >&2
              exit 1
            }
          done

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # x86-64 and ARM (Raspberry Pi, Ampere, Graviton, Apple silicon) in one multi-arch image.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Scanned before anything is published: a fixable CRITICAL/HIGH CVE in the image stops
      # the release here (the local amd64 build shares its layers with the multi-arch one).
      - name: Build the images for scanning
        run: |
          for target in server web; do
            docker buildx build --load --target "$target" -t "chinchi-$target:scan" .
          done
      - name: Scan the server image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chinchi-server:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      # The web image is Caddy's own binary on Alpine. Alpine packages block the release like the
      # server's; Go standard-library CVEs inside the Caddy binary are fixed only by a new Caddy
      # build, so they are reported here and picked up when Dependabot bumps the base image.
      - name: Scan the web image (OS packages)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chinchi-web:scan
          vuln-type: os
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan the web image (Caddy binary, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chinchi-web:scan
          vuln-type: library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Build and push images
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
          REGISTRY_LOWER: ${{ steps.version.outputs.registry }}
        run: |
          for target in server web; do
            image="$REGISTRY_LOWER/chinchi-$target"
            docker buildx build --platform linux/amd64,linux/arm64 --target "$target" \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.version=$VERSION" \
              -t "$image:$VERSION" -t "$image:$MINOR" --push .
            digest="$(docker buildx imagetools inspect "$image:$VERSION" --format '{{.Manifest.Digest}}')"
            echo "${target}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

      # Who built the image, from which commit and workflow, signed by GitHub (Sigstore).
      - name: Attest the server image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.version.outputs.registry }}/chinchi-server
          subject-digest: ${{ steps.build.outputs.server_digest }}
          push-to-registry: true
      - name: Attest the web image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.version.outputs.registry }}/chinchi-web
          subject-digest: ${{ steps.build.outputs.web_digest }}
          push-to-registry: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          cp deploy/docker-compose.yml dist/docker-compose.yml
          cp deploy/.env.example dist/env.example
          cp deploy/backup.sh deploy/restore.sh dist/
          cp deploy/docker-compose.monitoring.yml deploy/chinchi-dashboard.json dist/
          # Hand-written notes in docs/releases/<tag>.md win over generated ones.
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" dist/docker-compose.yml dist/env.example \
            dist/backup.sh dist/restore.sh \
            dist/docker-compose.monitoring.yml dist/chinchi-dashboard.json \
            --title "Chinchi $GITHUB_REF_NAME" "$@"
