name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to commits (the tag in the comment is what they resolve to): a moved or
# compromised tag cannot change what runs here. Dependabot keeps the pins fresh.
jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Known vulnerabilities in what ships (not dev tooling) fail the build.
      - run: pnpm audit --prod --audit-level=high

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      # Integration tests start Postgres via Testcontainers; Docker is preinstalled on the runner.
      - run: pnpm test:coverage

      - run: pnpm build

      - name: Generated files are up to date
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts apps/server/drizzle

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Same ports as `pnpm dev:up`, so the Playwright config defaults work unchanged.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chinchi
          POSTGRES_PASSWORD: chinchi
          POSTGRES_DB: chinchi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chinchi" --health-interval 2s --health-timeout 3s --health-retries 30
      valkey:
        image: valkey/valkey:9.0-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ['2525:1025', '8025:8025']
      rustfs:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: chinchi-dev
          RUSTFS_SECRET_KEY: chinchi-dev-secret
          # KMS as in deploy/docker-compose.dev.yml: the e2e server encrypts uploads at rest.
          RUSTFS_KMS_ENABLE: 'true'
          RUSTFS_KMS_BACKEND: local
          RUSTFS_KMS_KEY_DIR: /data/.kms
          RUSTFS_KMS_LOCAL_MASTER_KEY: chinchi-dev-kms-master-key-0123456789
        ports: ['9000:9000']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chinchi/e2e e2e:install
      # The server creates its bucket at start, so storage must be up first.
      - name: Wait for object storage
        run: timeout 60 sh -c 'until curl -fs http://localhost:9000/health; do sleep 1; done'
      # Not a job service: LiveKit needs its config file from the repository and must reach the
      # e2e server on the host with webhooks, so it runs on the host network.
      - name: Start LiveKit
        run: |
          docker run -d --name livekit --network host \
            --add-host host.docker.internal:127.0.0.1 \
            -e 'LIVEKIT_KEYS=devkey: chinchi-dev-livekit-secret-0123456789' \
            -v "$PWD/deploy/livekit.dev.yaml:/etc/livekit.yaml:ro" \
            livekit/livekit-server:v1.13.9 --config /etc/livekit.yaml
          timeout 60 sh -c 'until curl -fs http://localhost:7880; do sleep 1; done'
      - run: pnpm e2e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # The production images must keep building, and the stack they make must come up from
  # env.example alone, the way a first install does: secrets generated as the file says, the
  # domain pointed at localhost (Caddy signs it with its own CA), then probed through Caddy.
  docker:
    name: Docker images and install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: deploy
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fill .env like a fresh install
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^CHINCHI_VERSION=.*|CHINCHI_VERSION=local|" \
            -e "s|^CHINCHI_DOMAIN=.*|CHINCHI_DOMAIN=localhost|" \
            -e "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 32)|" \
            -e "s|^S3_SECRET_KEY=.*|S3_SECRET_KEY=$(openssl rand -hex 32)|" \
            -e "s|^LIVEKIT_API_SECRET=.*|LIVEKIT_API_SECRET=$(openssl rand -hex 32)|" \
            -e "s|^S3_KMS_MASTER_KEY=.*|S3_KMS_MASTER_KEY=$(openssl rand -hex 32)|" \
            -e "s|^INITIAL_ADMIN_EMAIL=.*|INITIAL_ADMIN_EMAIL=admin@example.com|" \
            .env

      - run: docker compose build

      - name: Start the stack and probe it through Caddy
        run: |
          docker compose up -d --wait --wait-timeout 180
          # Caddy's own CA signs the localhost certificate, so curl needs -k.
          curl -fsSk https://localhost/health | grep -q '"status":"ok"'
          curl -fsSk https://localhost/api/v1/instance | grep -q '"registrationMode"'
          curl -fsSk -o /dev/null -w '%{http_code}\n' https://localhost/ | grep -qx 200

      - name: Logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v
