# Local development dependencies. Not for production: credentials default to dev-only values
# and every port is bound to 127.0.0.1 so nothing is exposed to the network.
#
#   pnpm dev:up     start everything
#   pnpm dev:down   stop (data is kept in named volumes)
#   pnpm dev:reset  stop and wipe all data

name: chinchi-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chinchi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chinchi}
      POSTGRES_DB: ${POSTGRES_DB:-chinchi}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.0-alpine
    command: [valkey-server, --save, '60', '1', --loglevel, warning]
    ports:
      - 127.0.0.1:${VALKEY_PORT:-6379}:6379
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage (attachments, avatars, emoji).
  # Console: http://localhost:9001/rustfs/console/
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-chinchi-dev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-chinchi-dev-secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
      # KMS as in production, so S3_ENCRYPTION=on can be tried (the e2e server uses it).
      RUSTFS_KMS_ENABLE: 'true'
      RUSTFS_KMS_BACKEND: local
      RUSTFS_KMS_KEY_DIR: /data/.kms
      RUSTFS_KMS_LOCAL_MASTER_KEY: chinchi-dev-kms-master-key-0123456789
    ports:
      - 127.0.0.1:${S3_PORT:-9000}:9000
      - 127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001
    volumes:
      - rustfs-data:/data

  # Voice / video SFU.
  livekit:
    image: livekit/livekit-server:v1.13.9
    command: [--config, /etc/livekit.yaml]
    environment:
      # LiveKit requires secrets of at least 32 characters.
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-chinchi-dev-livekit-secret-0123456789}'
    ports:
      - 127.0.0.1:${LIVEKIT_PORT:-7880}:7880
      - 127.0.0.1:7881:7881
      - 127.0.0.1:7882:7882/udp
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    # Webhooks reach the API server running on the host (Linux needs the explicit mapping).
    extra_hosts:
      - host.docker.internal:host-gateway

  # Catches outgoing email (verification, password reset). Web UI on :8025.
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - 127.0.0.1:${SMTP_PORT:-2525}:1025
      - 127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025

  # Scrapes the API server's metrics (METRICS_PORT=9464 on the host). UI on :9090.
  # Only with `--profile monitoring`, e.g. for load tests.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    volumes:
      - ./prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - host.docker.internal:host-gateway

volumes:
  postgres-data:
  valkey-data:
  rustfs-data:
