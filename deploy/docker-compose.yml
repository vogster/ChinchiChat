# Chinchi in production: one server, everything in containers, HTTPS by Caddy.
# Needs only this file and a .env next to it (from env.example):
#
#   docker compose up -d
#
# Open to the internet: TCP 80 and 443 (Caddy), TCP 7881 and UDP 7882, 3478 (LiveKit media/TURN).
# Nothing else is published; services talk over the compose network.
# To build the images from source instead: add -f docker-compose.build.yml (see that file).

name: chinchi

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: chinchi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: chinchi
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U chinchi -d chinchi']
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    <<: *restart
    image: valkey/valkey:9.0-alpine@sha256:187679e3bd4036959631e3f03983ab2ba503ab21e6fd0454d508e909db2ee989
    command: [valkey-server, --save, '60', '1', --loglevel, warning]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30

  rustfs:
    <<: *restart
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: 'false'
      # Files are encrypted at rest: object keys are wrapped by this master key, which lives in
      # .env, not in the data volume, so a copy of the volume alone reads as noise.
      RUSTFS_KMS_ENABLE: 'true'
      RUSTFS_KMS_BACKEND: local
      RUSTFS_KMS_KEY_DIR: /data/.kms
      RUSTFS_KMS_LOCAL_MASTER_KEY: ${S3_KMS_MASTER_KEY:?set S3_KMS_MASTER_KEY in .env}
    volumes:
      - rustfs-data:/data

  livekit:
    <<: *restart
    image: livekit/livekit-server:v1.13.9@sha256:d0c04791bf63ca8dcea123571827d56ba9504bd57c8d5de60ee03b5408cc3154
    environment:
      # The API secret; the key name "chinchi" matches the server's LIVEKIT_API_KEY below.
      LIVEKIT_KEYS: 'chinchi: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}'
      # The whole config inline, so no file has to sit next to this one.
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          # Media: one UDP port (muxed), TCP as a fallback when UDP is blocked.
          udp_port: 7882
          tcp_port: 7881
          # Learns the server's public address via STUN, for clients behind NAT.
          use_external_ip: true
        # Embedded TURN for clients whose networks block direct UDP to the server.
        turn:
          enabled: true
          udp_port: 3478
        webhook:
          api_key: chinchi
          urls:
            - http://server:3000/api/v1/voice/webhook
        logging:
          level: info
    ports:
      - 7881:7881
      - 7882:7882/udp
      - 3478:3478/udp

  server:
    <<: *restart
    image: ghcr.io/vogster/chinchi-server:${CHINCHI_VERSION:-0.19.0}
    environment:
      DATABASE_URL: postgres://chinchi:${POSTGRES_PASSWORD}@postgres:5432/chinchi
      REDIS_URL: redis://valkey:6379
      WEB_ORIGINS: https://${CHINCHI_DOMAIN:?set CHINCHI_DOMAIN in .env}
      PUBLIC_URL: https://${CHINCHI_DOMAIN}
      # Exactly one hop is trusted: Caddy, the only thing that reaches the server. (`true` would
      # take the leftmost X-Forwarded-For entry, which a client controls once anything in front
      # of Caddy passes the header through; see TRUSTED_PROXIES for a proxy before Caddy.)
      TRUST_PROXY: '1'
      INSTANCE_NAME: ${INSTANCE_NAME:-Chinchi}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-on}
      GATEWAY_MAX_CONNECTIONS_PER_ADDRESS: ${GATEWAY_MAX_CONNECTIONS_PER_ADDRESS:-100}
      # Required: otherwise whoever registers first on a fresh domain would run the instance.
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?set INITIAL_ADMIN_EMAIL in .env}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Chinchi <no-reply@localhost>}
      S3_ENDPOINT: http://rustfs:9000
      # Files and voice on the main domain unless FILES_DOMAIN / VOICE_DOMAIN give them their own.
      S3_PUBLIC_URL: https://${FILES_DOMAIN:-${CHINCHI_DOMAIN}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_ENCRYPTION: 'on'
      # Two-factor secrets are encrypted in the database under this key (kept in .env).
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY in .env (openssl rand -hex 32)}
      LIVEKIT_URL: wss://${VOICE_DOMAIN:-${CHINCHI_DOMAIN}/livekit}
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: chinchi
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Prometheus metrics for the private network only: the port is not published.
      METRICS_PORT: 9464
      METRICS_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      rustfs:
        condition: service_started
      livekit:
        condition: service_started

  # The web app on Caddy, which also terminates TLS and proxies the API, files and voice.
  web:
    <<: *restart
    image: ghcr.io/vogster/chinchi-web:${CHINCHI_VERSION:-0.19.0}
    environment:
      CHINCHI_DOMAIN: ${CHINCHI_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN:-}
      VOICE_DOMAIN: ${VOICE_DOMAIN:-}
      # Proxies in front of Caddy whose X-Forwarded-For is trusted (CIDRs); empty when none.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
      - ${HTTPS_PORT:-443}:443/udp
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  postgres-data:
  valkey-data:
  rustfs-data:
  caddy-data:
  caddy-config:
